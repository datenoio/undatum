"count-jsonl" = { seconds = 0.9, rss_mb = 160 }
headers = { seconds = 1.0, rss_mb = 100 }
rename = { seconds = 1.0, rss_mb = 140 }
fill = { seconds = 1.0, rss_mb = 140 }
dedup = { seconds = 4.0, rss_mb = 180 }
select = { seconds = 1.2, rss_mb = 150 }
sort = { seconds = 1.2, rss_mb = 250 }
frequency = { seconds = 1.0, rss_mb = 150 }
uniq = { seconds = 1.0, rss_mb = 150 }
stats = { seconds = 3.9, rss_mb = 240 }
schema = { seconds = 1.8, rss_mb = 170 }
sql = { seconds = 1.0, rss_mb = 150 }
"convert-parquet" = { seconds = 1.2, rss_mb = 210 }
"convert-jsonl" = { seconds = 1.3, rss_mb = 160 }
"convert-orc" = { seconds = 1.6, rss_mb = 250 }

