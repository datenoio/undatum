# Budgets for scripts/benchmarks.py: median wall time (seconds) and peak resident memory (MB)
# per command and dataset tier. A command over its budget fails the benchmark job.
#
# Calibrated on 2026-10-08 (macOS arm64, Python 3.13): time budget = max(3 x measured,
# measured + 0.5 s) to absorb slower CI runners; memory budget = 1.3 x measured + 20 MB, tight
# enough that holding a 100k-row input in memory breaks it. The 100k time budgets were raised on
# 2026-10-09 to 1.4 x the time measured on the GitHub ubuntu-latest runner (rounded up to 0.1 s),
# which is 3-5 times slower than the Mac for commands that import iterabledata. Lower a budget
# when a command gets faster; raise one only with the reason in the commit message.
#
# Recalibrated on 2026-10-29 after the DuckDB-first work (macOS arm64, Python 3.11, DuckDB 2.0,
# median of 3-5 runs alternated with 1.9.1): 1M budgets by the formulas above where they are
# lower; 100k time budgets lowered by the measured speedup where a command got faster by more
# than 20% (select, convert-jsonl); memory budgets by the formula where it is lower.
# convert-orc is new: 100k time as convert-parquet, which takes the same time on the Mac.
# DuckDB 2.0 connections start about 20 MB larger than 1.5 (66 MB against 44 MB), which
# head, count, rename, fill and sql show. uniq and frequency number the input on one thread
# to keep first-seen order (1M rows: about 75 MB less, 0.1 s more), so their 1M memory is lower.
# Lowered again on 2026-10-29 when commands on the DuckDB path stopped importing iterabledata,
# pyarrow and pandas (0.5-1.2 s and 60-110 MB per run): 100k time budgets by the measured
# speedup, 1M budgets and memory by the formulas above.

# Each [command] in "faster" must stay faster than the second one.
faster = [["count", "sort"], ["count-jsonl", "sort"], ["head", "sort"]]

[tier.100k]
help = { seconds = 1.0, rss_mb = 90 }
version = { seconds = 0.7, rss_mb = 80 }
