version: 2
updates:
  # uv, not pip: it updates uv.lock together with pyproject.toml (CI runs `uv lock --check`).
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: security-updates
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
