# conda-forge recipe for staged-recipes (https://github.com/conda-forge/staged-recipes).
#
# Blocked until iterabledata and qddate have conda-forge feedstocks (checked 2026-10-09:
# neither is on conda-forge). Submit those first, then copy this file to
# recipes/undatum/meta.yaml in staged-recipes with the version and sha256 of the PyPI sdist.
{% set name = "undatum" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/undatum-{{ version }}.tar.gz
  sha256: REPLACE_WITH_SDIST_SHA256

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - undatum = undatum.__main__:main
    - data = undatum.__main__:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=70
  run:
    - python >=3.10
    - avro >=1.11.3,<2
    - python-duckdb >=1.3,<2
    - iterabledata >=1.0.21,<1.1
    - lz4 >=4.3.2,<5
    - openpyxl >=3.1.2,<4
    - orjson >=3.9.15,<4
    - pandas >=2.2.2,<4
    - pyarrow >=16.0.0
    - py7zr >=0.20.6,<2
    - pydantic >=2.5,<3
    - pymongo >=4.6.3,<5
    - pyorc >=0.9.0,<1
    - python-docx >=1.1.0,<2
    - pyyaml >=6.0.1,<7
    - pyzstd >=0.16,<1
    - qddate >=1.0.4,<2
    - requests >=2.33.0,<3
    - rich >=13.6.0,<16
    - typer >=0.17,<1
    - validators >=0.22.0,<1
    - xlrd >=2.0.1,<3
    - xmltodict >=0.13.0,<2
    - python-xxhash >=3.0,<5
    - zstandard >=0.22,<1

test:
  imports:
    - undatum
  commands:
    - undatum --version
    - undatum formats list --json
  requires:
    - pip

about:
  home: https://github.com/datenoio/undatum
  summary: Convert, inspect, validate and transform data files
  license: MIT
  license_file: LICENSE
  doc_url: https://datenoio.github.io/undatum/
  dev_url: https://github.com/datenoio/undatum

extra:
  recipe-maintainers:
    - REPLACE_WITH_GITHUB_HANDLE
