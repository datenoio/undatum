[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undatum"
dynamic = ["version"]
description = "A powerful command-line tool for data processing and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ivan Begtin", email = "ivan@begtin.tech"}
]
keywords = ["json", "jsonl", "csv", "bson", "cli", "dataset", "data-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
    "Topic :: Text Processing",
    "Topic :: Utilities"
]
dependencies = [
    # Every direct dependency has a lower bound tested by the "lowest direct dependencies"
    # CI job and an upper bound below the next major version, except where noted;
    # scripts/check_dependency_bounds.py enforces this.
    "avro>=1.11.3,<2",
    "duckdb>=1.3,<2",
    "iterabledata>=1.0.21,<1.1",
    "lz4>=4.3.2,<5",
    "openpyxl>=3.1.2,<4",
    "orjson>=3.9.15,<4",
    "pandas>=2.2.2,<4",
    # No upper bound: pyarrow ships a major version every few months without breaking the
    # Parquet/ORC reader and writer API used here (exempt in check_dependency_bounds.py).
    "pyarrow>=16.0.0",
    "py7zr>=0.20.6,<2",
    "pydantic>=2.5,<3",
    # Provides the ``bson`` module for BSON files as well as the MongoDB driver.
    "pymongo>=4.6.3,<5",
    "pyorc>=0.9.0,<1",
    "python-docx>=1.1.0,<2",
    "pyyaml>=6.0.1,<7",
    "pyzstd>=0.16,<1",
    "qddate>=1.0.4,<2",
    "requests>=2.33.0,<3",
    "rich>=13.6.0,<16",
    "typer>=0.26,<1",
    "validators>=0.22.0,<1",
    "xlrd>=2.0.1,<3",
    "xmltodict>=0.13.0,<2",
    "xxhash>=3.0,<5",
    "zstandard>=0.22,<1",
]

[project.urls]
Homepage = "https://github.com/datenoio/undatum"
Documentation = "https://datenoio.github.io/undatum/"
Repository = "https://github.com/datenoio/undatum"
Changelog = "https://github.com/datenoio/undatum/blob/master/CHANGELOG.md"
Issues = "https://github.com/datenoio/undatum/issues"

[project.optional-dependencies]
extract = [
    "pdfplumber>=0.10,<1",
    "pdf2image>=1.16,<2",
    "pytesseract>=0.3.10,<1",
    "textract>=2.0,<3",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
]
plot = [
    "matplotlib>=3.7,<4",
]
# National phone numbers in validation rules (format: phone with region).
phone = [
    "phonenumbers>=8.13,<10",
]
tui = [
    "textual>=0.80,<9",
]
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]
mcp = [
    # Both the 1.x FastMCP and the 2.x MCPServer APIs are supported.
    "mcp>=1.2,<3",
]
langchain = [
    "langchain-core>=0.3,<2",
]
polars = [
    "polars>=1.0,<3",
]
dask = [
    "dask[dataframe]>=2024.1",
]
s3 = [
    "boto3>=1.28,<2",
]
gcs = [
    "fsspec>=2024.2",
    "gcsfs>=2024.2",
]
azure = [
    "fsspec>=2024.2",
    "adlfs>=2024.2",
]
cloud = [
    "fsspec>=2024.2",
    "s3fs>=2024.2",
    "gcsfs>=2024.2",
    "adlfs>=2024.2",
]
frictionless = [
    "frictionless>=5.0,<6",
]
elastic = [
    "elasticsearch>=8,<10",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
]
mysql = [
    "pymysql>=1.1,<2",
]
mssql = [
    "pyodbc>=5.0,<6",
]
clickhouse = [
    # The driver iterabledata uses for clickhouse:// URIs.
    "clickhouse-connect>=0.7,<2",
]
lakehouse = [
    "iterabledata[lakehouse]",
]
gis = [
    "iterabledata[geospatial]",
    "iterabledata[lidar]",
]
scientific = [
    "iterabledata[mat]",
    "iterabledata[geophysical]",
    "iterabledata[hdf5]",
]
access = [
    "iterabledata[access]",
]
compression = [
    "iterabledata[compression]",
]
# Every optional feature (the previous behaviour of a plain install plus all extras).
all = [
    "undatum[extract,api,plot,phone,tui,web,mcp,langchain,polars,dask,cloud,frictionless,elastic,postgres,mysql,mssql,clickhouse,lakehouse,gis,scientific,access,compression]",
]
# Tool versions are pinned here and mirrored in .pre-commit-config.yaml and CI;
# scripts/check_tool_versions.py fails CI when they drift.
dev = [
    "ruff==0.14.9",
    "mypy==1.19.1",
    "types-PyYAML",
    "types-requests",
    "types-PyMySQL",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "pre-commit>=3.7",
]

[project.scripts]
undatum = "undatum.__main__:main"
data = "undatum.__main__:main"
undatum-mcp = "undatum.mcp.server:main"

[tool.setuptools.dynamic]
# Single source of truth: undatum/__init__.py (__version__).
version = {attr = "undatum.__version__"}

[tool.setuptools.packages.find]
include = ["undatum*"]

[tool.setuptools.package-data]
"undatum.templates" = ["*.yml"]
"undatum.validate" = ["data/*.json"]
"undatum.recipes" = ["*.yml"]
"undatum.web" = ["templates/*.html", "static/*"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/undatum.1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Keep each file's existing line endings (the repository mixes LF and CRLF).
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint rules (replaces the separate pylint run)
    "D",   # docstrings (Google convention), scoped below
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # Size/complexity limits (pylint's too-many-* checks were disabled as well).
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR2004",  # magic values in comparisons
    "PLC0415",  # imports inside functions keep CLI start-up fast (optional extras, heavy libs)
    "PLW0603",  # module-level caches updated with `global`
    "PLW2901",  # normalising a loop variable (`line = line.strip()`)
    "D105",     # magic methods
    "D107",     # __init__ arguments are documented in the class docstring (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules are enforced for commands and the SDK; extend the scope as other
# packages get documented.
"!undatum/{cmds,sdk}/**" = ["D"]
# Plugin base classes intentionally provide optional no-op hooks
"undatum/plugins/base.py" = ["B024", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["undatum"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Fully annotated packages: new code there must be typed (ratchet, see
# scripts/mypy_ratchet.py). Add packages as they are cleaned up.
module = ["undatum.common.*", "undatum.io.*", "undatum.ops.*", "undatum.sdk.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "click.*",
    "openpyxl.*",
    "orjson.*",
    "pandas.*",
    "pymongo.*",
    "qddate.*",
    "validators.*",
    "xlrd.*",
    "xmltodict.*",
    "rich.*",
    "duckdb.*",
    "pyzstd.*",
    "pydantic.*",
    "typer.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["undatum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: needs a live database server (see tests/integration/test_databases.py)",
    "benchmark: performance benchmarks",
    "memory: peak-memory budgets (set UNDATUM_MEMORY_TESTS=1)",
]
